name: Fetch generated assets

# Downloads newly generated campaign images listed in scripts/generated-images.json
# into src/assets/incoming/ and commits them to the branch that triggered the run.
on:
  push:
    branches: ["feat/**"]
    paths: ["scripts/generated-images.json"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images
        run: |
          mkdir -p src/assets/incoming
          node -e '
            const list = require("./scripts/generated-images.json");
            const fs = require("fs");
            (async () => {
              for (const [name, url] of Object.entries(list)) {
                const res = await fetch(url);
                if (!res.ok) throw new Error(name + ": HTTP " + res.status);
                fs.writeFileSync("src/assets/incoming/" + name + ".png", Buffer.from(await res.arrayBuffer()));
                console.log("saved", name);
              }
            })().catch((e) => { console.error(e); process.exit(1); });
          '
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/incoming
          git commit -m "chore: add generated campaign images [skip ci]" || exit 0
          git push
